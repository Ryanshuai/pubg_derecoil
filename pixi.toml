[workspace]
name = "pubg_derecoil"
version = "0.1.0"
description = "PUBG HUD detection (CV/DL) + hardware recoil control over a Pico USB mouse"
channels = ["conda-forge"]
platforms = ["win-64"]

# conda provides the interpreter only. Everything else comes from PyPI so
# there is exactly one opencv / numpy in the environment — the old base env
# had conda's cv2 4.11 shadowing pip's opencv-python 4.13, which is the kind
# of split this move is meant to end.
[dependencies]
python = "3.12.*"

# Versions float: take whatever resolves, `pixi run smoke` is what says it
# works. pixi.lock pins the exact set, so the environment is still
# reproducible — `pixi update` is the deliberate way to move it forward.
[pypi-dependencies]
# CUDA build. The index is pinned per-package so the rest of the tree still
# resolves from PyPI.
#
# cu130, not cu128: the cu128 channel stopped at torch 2.11.0 while cu130
# carries 2.13.0, so staying on cu128 silently freezes torch. Driver 610.88
# is far past cu130's floor, and the machine's other conda env was already
# running a cu130 build.
torch = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu130" }

numpy = "*"
opencv-python = "*"
pillow = "*"
scipy = "*"                 # calibration/bullet_detect.py
scikit-learn = "*"          # unpickles dl_models/fire_mode_structural_rf.pkl —
                            # if a version bump ever breaks that load, smoke
                            # catches it at FireModeDetector construction
matplotlib = "*"            # calibrate_k / auto_calibrate plots

pyserial = "*"              # Pico CDC link
hidapi = "*"                # press/razer_dpi.py (imports as `hid`)
pywin32 = "*"               # win32gui/ui/con/process — GDI capture, focus checks
bettercam = "*"             # DXGI capture backend
psutil = "*"                # foreground-process checks
loguru = "*"
ultralytics = "*"           # human_detection RT-DETR/YOLO

[tasks]
robot = "python robot.py"
sweep = "python calibration/sweep.py"
calibrate-k = "python calibration/calibrate_k.py"
spawner = "python control/spawner.py"
stocktake = "python control/stock.py"
one-gun = "python tools/test_one_gun.py"
k-audit = { cmd = "python tools/audit_k.py" }
cube = "python tools/probe_mp5k_cube.py"
kick-recovery = "python tools/probe_kick_recovery.py"
kit-floor = "python tools/test_kit_floor.py"
collect = "python calibration/legacy_collect_templates.py"
collect-intersect = "python calibration/collect_intersect.py"
intersect-test = "python tools/test_intersect.py"
intersect-order = "python tools/intersect_order.py"
# Photograph 库存 row ICONS through four pitches and intersect them. The
# runtime names rows by ICON and every row read `unknown` on 2026-08-10 --
# top-1 mostly CORRECT (mse 206/226/340) and rejected by gates of 150 and
# 1.25, because the stored templates carry a background the panel composites
# fresh every frame. `--selftest` is the offline half: the intersection and
# its five refusals on synthetic crops, no game and no hardware.
inventory-batch = "python calibration/collect_inventory_vlm.py"
inventory-test = "python calibration/collect_inventory_vlm.py --selftest"
row-names = "python tools/record_row_names.py"
row-templates = "python calibration/build_row_name_templates.py"
mine-tiles = "python calibration/mine_slot_tiles.py"
solve-tiles = "python calibration/solve_tiles.py"
tiles-todo = "python calibration/tile_harvest.py"
attach = "python control/inventory.py"
capture-ads = "python calibration/capture_ads.py"
fit-ads = "python calibration/fit_ads_detector.py"
smoke = "python tools/smoke_check.py"
layering = "python tools/check_layering.py"
surface = "python tools/surface.py"
panel-state = "python tools/test_panel_state.py"
tab-watch = "python tools/test_tab_watch.py"
tab-open = "python tools/test_tab_open.py"
name-plates = "python tools/test_name_plates.py"
highlight = "python tools/eval_highlight.py"
setup-verdict = "python tools/test_setup_verdict.py"
attachments = "python calibration/legacy_score_attachments.py"
att-coverage = "python tools/attachment_gun_coverage.py"
spread-hosts = "python tools/test_spread_hosts.py"
cross-gun = "python tools/cross_gun_template_diff.py"
drag-log = "python tools/drag_log.py"
locations = "python tools/test_locations.py"
collect-timed = "python calibration/collect_timed.py"
fire = "python tools/test_fire_guard.py"
detect-retry = "python tools/test_detect_retry.py"
spawner-plan = "python tools/test_spawner_plan.py"
kit = "python tools/test_ensure_kit.py"
frames = "python tools/test_frames.py"
runs = "python tools/test_capture_run.py"
# 边玩边观测那条路，离线。合成帧 + 合成手部计数器，不碰游戏也不碰 Pico。
play-selftest = "python tools/test_play_observer.py"
harness = "python tools/test_harness.py"
night = "python harness/night.py"
verify-pico = "python tools/verify_pico.py"
abs-offset = "python tools/test_abs_offset.py"
recenter = "python tools/test_recenter.py"
snap = "python tools/snap_on_key.py"
snap-att = "python tools/snap_on_key.py --kind attachment"
snaps = "python tools/test_snapshot.py"
stocktake-test = "python tools/test_stocktake.py"
lobby-detector = "python tools/verify_lobby_detector.py"
dump-state = "python tools/dump_state.py"
names = "python tools/check_names.py"
gen-protocol = "python tools/gen_protocol.py"
protocol-check = "python tools/gen_protocol.py --check"
gestures = "python tools/check_gestures.py"
params = "python tools/check_params.py"
head-shortfall = "python tools/probe_head_shortfall.py"
surface-check = "python tools/surface.py --check"
surface-drift = "python tools/surface.py --drift"
map-detect = "python detector/map_detector.py --selftest"
# 18 assertions on data/kit_factors.json, which is now UNREBUILDABLE (its
# reader and every source run are gone) and is read by weapon_attachments on
# every import. Had no task until 2026-08-08 — the file that could have caught
# its own builder breaking was the one nobody could run.
kit-factors = "python calibration/build_kit_factors.py --selftest"
kit-grid = "python calibration/build_kit_grid.py"
kit-grid-check = "python calibration/build_kit_grid.py --selftest"
placement = "python tools/test_range_placement.py"
plan-order = "python tools/test_plan_order.py"
# Every path named in a skill, an agent or a CLAUDE.md must point INTO a tree
# that exists. Added 2026-08-08 after a refactor moved the artifacts and left
# 20 pointers on the old layout while layering/surface/params stayed green —
# a step written in Markdown is invisible to every import graph.
pointers = "python tools/check_pointers.py"
# MODEL.md's 「常数现值」 table is a SECOND AUTHOR for numbers config.py holds,
# and c196aa0 -- the commit before this gate -- is titled "MODEL.md carried
# D = -19 after it became -90". The spec is the 主法则, so a reader taking a
# number from it is doing the right thing with a stale value. Reads every value
# from config at run time and carries no copy of its own. ⚠ Its first run
# failed on the WRONG row: a second table in the same section also opens with
# `D`, so it read that one's `0`. 3/3 mutations bite (perturb MODEL.md, perturb
# config, delete a paired row).
model-consts = "python tools/check_model_constants.py"
fit-time = "python calibration/fit_time_curve.py --selftest"
# What is measured, what is guessed, what has never been fired. A REPORT, not
# a gate — it exits 0 by construction. It earns a task because its answer is a
# function of the sample store and moves with every magazine, so unlike the
# probes this directory deleted, it cannot be written down once and retired.
coverage = "python tools/coverage.py"
# A PRIOR for a cell nobody has fired, built from cells somebody has: borrow
# the nearest measured shape, price the kit and the optic from measured
# ratios, ship it marked `seed`. `estimate --check` is the hold-out — it
# estimates the cells that ARE measured and reports the error, which is the
# only number that says whether the thing is worth shipping.
estimate = "python tools/estimate_cell.py"
# A pickup must not disarm the tool. `('clear_attachments',)` hung off the F
# key, so one loot dropped the curve key to `bare` and the compensation stayed
# off until the player opened Tab by hand — 30 bursts in a play log with
# `[armed]` printed once. Checks BOTH directions: the kit survives a pickup,
# and a real weapon swap still clears it.
kit-persist = "python tools/test_kit_persist.py"
# An optic is a SCALAR, so one measured cell covers every optic. 72 of the 76
# curves on disk are red-dot and the lookup keys on the sight, so every
# magnified optic on every gun missed and printed `no fitted curve ... NOT
# compensating` -- the same line an unmeasured kit prints. Checks both
# directions: a 4x gets the red dot's curve x one number, AND a measured cell
# still beats the table, AND the three axes that change the curve's SHAPE
# (weapon, kit, fire mode) never substitute.
sight-scale = "python tools/test_sight_scale.py"
# Is the boxed slot number 「1」「2」 drawn -- i.e. is the panel up AND is there a
# gun in that slot. Sharper than "is the inventory open", and it sits INSIDE the
# rectangle tab_watch already grabs, so it costs no second grab and puts the
# openness judgement and the loadout on the same pixels at the same instant.
# 38 real frames labelled BY EYE, both sides: panel white 110-112 / dark 29-51,
# world white 0-3 / dark 112-205. ⚠ 8 of the 38 were saved under a filename
# that said `closing` and show bare grass -- a stale `open` flag, which is what
# this replaces. Nothing consumes it yet.
gun-tag = "python detector/gun_tag_detector.py --selftest"
# `print` goes to the terminal AND the file; `note` goes to the file ONLY.
# Measured on two real play logs: `[tab]` and `[state]` were 79% and 82% of
# what reached the screen, and the status table — the one thing a player reads
# while playing — was 8 lines of 234, scrolled away between every pair of Tab
# presses. Nothing is dropped; it all still lands in the file, timestamped.
# ⚠ The two cases that matter are NEGATIVE: a note must not reach the terminal,
# and with no log open it must NOT be swallowed (the terminal is then the only
# record). A test asserting only "it wrote something" passes under both bugs.
logbook = "python logbook.py --selftest"
# What a magnified optic does to the counts a gun needs. `scope` reads the
# store and stops (no game, no hardware); the live run wants --weapon and fires.
# ⚠ The scope factor is DERIVABLE from config.RECOIL_SIGHT_PROFILES, so this
# exists to falsify that derivation, not to fit around it — see the module
# docstring. `scope-test` plants a known ratio and a known K and checks both
# come back, plus the four refusals.
scope = "python calibration/calibrate_scope.py"
scope-test = "python calibration/calibrate_scope.py --selftest"
# The correlator-bias judge, against three known b(delta) it has to tell apart:
# flat px-per-pair, a fixed fraction of each pair (absorbed by K, harmless), and
# peak-locking. Its first version read delta^-0.23 off data built dead flat.
# Reversing the chi2 comparison makes it exit 1 — verified 2026-08-08.
bias-judge = "python tools/probe_correlator_bias.py --selftest"
# `C` in y_true = y_obs + C(t-M), against a tick-exact transcription of main.c.
# It matters more than it looks: the collection arm that carries the answer is
# the COMPENSATED one, where |y_obs| is ~36 counts against a C of ~900, so C is
# not a correction on that arm -- it is the measurement. Two integrations, one
# continuous and one per-millisecond, agreeing to within a single carried count
# is what licenses using the cheap one everywhere. It also holds the ruling-out
# of two mechanisms (int-with-carry, a slow main loop) so they stay ruled out.
comp-counts = "python tools/test_comp_counts.py"
# Parse the vendored community patterns and report what they cover. A gun with
# no curve fires with NO compensation, and for a high-recoil weapon that is not
# merely inaccurate -- the view reaches open sky, where phase correlation
# returns 0 CONFIDENTLY and the magazine is lost with every gate green. Read
# only; `--seed <guns>` is what writes, and it refuses over both a fitted file
# and a store that can already answer.
kava4 = "python tools/import_kava4.py"
# "Is the game driveable right now" -- ask without firing anything. All five
# legs already existed and every collector already calls ensure_ready() on its
# first line; what was missing was a DOOR, so the only way to find out was to
# start a run and watch. ⚠ It calls ensure_ready and prints what came back; the
# moment it grows its own idea of "ready", the thing scripts depend on and the
# thing a human checks stop being the same thing.
ready = "python control/session.py"
# The cell order when a slot has MORE THAN TWO values. order_configs solves the
# binary case by brute-forcing 8!; five grips x four muzzles x three stocks is
# 60 cells and 60! is not enumerable. gray_order constructs the mixed-radix
# reflected Gray tour instead -- N cells in N-1 slot changes, which is the
# floor by counting rather than by search. ⚠ Its first version accumulated the
# INPUT digit instead of the output one and sent the 2^3 tour to 8 changes
# where order_configs already proves 7; that case is in here for that reason.
gray = "python tools/test_gray_order.py"
# "Replicate it" has no meaning on pooled data -- a fit eats the whole store at
# once. This is the shape that rule takes there: cut by (session x curve arm)
# and ask whether the slices agree, with the baseline computed from the
# within-group per-magazine CV so "they differ by 2%" has a yardstick. The arm
# axis is not optional: without it the same check reported 1.54% and called it
# a session effect, which is the confound MODEL.md sec.4's nine-run table also
# has. Offline; no game, no Pico.
session-split = "python calibration/fit_time_curve.py --weapon mp5k --config bare --by-session"
