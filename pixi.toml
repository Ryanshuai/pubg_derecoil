[workspace]
name = "pubg_derecoil"
version = "0.1.0"
description = "PUBG HUD detection (CV/DL) + hardware recoil control over a Pico USB mouse"
channels = ["conda-forge"]
platforms = ["win-64"]

# conda provides the interpreter only. Everything else comes from PyPI so
# there is exactly one opencv / numpy in the environment — the old base env
# had conda's cv2 4.11 shadowing pip's opencv-python 4.13, which is the kind
# of split this move is meant to end.
[dependencies]
python = "3.12.*"

# Versions float: take whatever resolves, `pixi run smoke` is what says it
# works. pixi.lock pins the exact set, so the environment is still
# reproducible — `pixi update` is the deliberate way to move it forward.
[pypi-dependencies]
# CUDA build. The index is pinned per-package so the rest of the tree still
# resolves from PyPI.
#
# cu130, not cu128: the cu128 channel stopped at torch 2.11.0 while cu130
# carries 2.13.0, so staying on cu128 silently freezes torch. Driver 610.88
# is far past cu130's floor, and the machine's other conda env was already
# running a cu130 build.
torch = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu130" }

numpy = "*"
opencv-python = "*"
pillow = "*"
scipy = "*"                 # calibration/bullet_detect.py
scikit-learn = "*"          # unpickles dl_models/fire_mode_structural_rf.pkl —
                            # if a version bump ever breaks that load, smoke
                            # catches it at FireModeDetector construction
matplotlib = "*"            # calibrate_k / auto_calibrate plots

pyserial = "*"              # Pico CDC link
hidapi = "*"                # press/razer_dpi.py (imports as `hid`)
pywin32 = "*"               # win32gui/ui/con/process — GDI capture, focus checks
bettercam = "*"             # DXGI capture backend
psutil = "*"                # foreground-process checks
loguru = "*"
ultralytics = "*"           # human_detection RT-DETR/YOLO

[tasks]
robot = "python robot.py"
sweep = "python calibration/sweep.py"
calibrate-k = "python calibration/calibrate_k.py"
spawner = "python control/spawner.py"
stocktake = "python control/stock.py"
one-gun = "python tools/test_one_gun.py"
k-audit = { cmd = "python tools/audit_k.py" }
cube = "python tools/probe_mp5k_cube.py"
collect = "python calibration/collect_templates.py"
attach = "python control/inventory.py"
capture-ads = "python calibration/capture_ads.py"
fit-ads = "python calibration/fit_ads_detector.py"
smoke = "python tools/smoke_check.py"
layering = "python tools/check_layering.py"
surface = "python tools/surface.py"
panel-state = "python tools/test_panel_state.py"
tab-watch = "python tools/test_tab_watch.py"
tab-open = "python tools/test_tab_open.py"
name-plates = "python tools/test_name_plates.py"
highlight = "python tools/eval_highlight.py"
setup-verdict = "python tools/test_setup_verdict.py"
attachments = "python calibration/score_attachments.py"
drag-log = "python tools/drag_log.py"
locations = "python tools/test_locations.py"
collect-timed = "python calibration/collect_timed.py"
fire = "python tools/test_fire_guard.py"
detect-retry = "python tools/test_detect_retry.py"
spawner-plan = "python tools/test_spawner_plan.py"
kit = "python tools/test_ensure_kit.py"
frames = "python tools/test_frames.py"
runs = "python tools/test_capture_run.py"
harness = "python tools/test_harness.py"
night = "python harness/night.py"
verify-pico = "python tools/verify_pico.py"
abs-offset = "python tools/test_abs_offset.py"
recenter = "python tools/test_recenter.py"
snaps = "python tools/test_snapshot.py"
stocktake-test = "python tools/test_stocktake.py"
lobby-detector = "python tools/verify_lobby_detector.py"
dump-state = "python tools/dump_state.py"
names = "python tools/check_names.py"
gen-protocol = "python tools/gen_protocol.py"
protocol-check = "python tools/gen_protocol.py --check"
gestures = "python tools/check_gestures.py"
params = "python tools/check_params.py"
surface-check = "python tools/surface.py --check"
surface-drift = "python tools/surface.py --drift"
map-detect = "python detector/map_detector.py --selftest"
# 18 assertions on data/kit_factors.json, which is now UNREBUILDABLE (its
# reader and every source run are gone) and is read by weapon_attachments on
# every import. Had no task until 2026-08-08 — the file that could have caught
# its own builder breaking was the one nobody could run.
kit-factors = "python calibration/build_kit_factors.py --selftest"
kit-grid = "python calibration/build_kit_grid.py"
kit-grid-check = "python calibration/build_kit_grid.py --selftest"
placement = "python tools/test_range_placement.py"
plan-order = "python tools/test_plan_order.py"
# Every path named in a skill, an agent or a CLAUDE.md must point INTO a tree
# that exists. Added 2026-08-08 after a refactor moved the artifacts and left
# 20 pointers on the old layout while layering/surface/params stayed green —
# a step written in Markdown is invisible to every import graph.
pointers = "python tools/check_pointers.py"
fit-time = "python calibration/fit_time_curve.py --selftest"
